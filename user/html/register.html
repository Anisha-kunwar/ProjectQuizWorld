<!DOCTYPE html>
<html lang="en">
<head>

    <title>Quiz World - Sign Up</title>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/register.css">

</head>
<body>

    <!-- Navigation Arrows -->

    <div class="navigation-arrows">

        <!-- Back Button -->
        <a href="../html/login.html" class="arrow-btn">
            &#8592;
        </a>

        <!-- Next Button -->
        <a href="../html/dashboard.html" class="arrow-btn">
            &#8594;
        </a>

    </div>


    <div class="container">

        <!-- Left Side -->

        <div class="left-side">

            <h1>Join Quiz World!</h1>

            <p>
                Join thousands of learners and
                begin your quiz journey with us.
            </p>

        </div>


        <!-- Right Side -->

        <div class="right-side">

            <h1>Create Account</h1>


            <!-- Registration Form -->
<form action="../php/register.php" method="POST">

    <label for="fullname">Full Name</label>
    <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter your full name"
        required
    >

    <label for="email">Email</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
    >

    <label for="confirmPassword">Confirm Password</label>
    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        required
    >

    <button type="submit">CREATE ACCOUNT</button>

</form>

            <!-- Login Link -->

            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>
    <div class="role-selector">

    <label for="role">Role:</label>

    <select id="role" onchange="changeRole()">

        <option value="student">User</option>
        <option value="admin">Admin</option>

    </select>

</div>


    <!-- JavaScript File -->

    <script src="../js/register.js"></script>

</body>
</html>
