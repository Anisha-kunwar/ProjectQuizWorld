<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">
                <img src="logo.jpeg" alt="Online Quiz Platform">
            </div>
        </div>
        <nav class="nav-bar">
            <input type="text" placeholder="search/help">
        </nav>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="admin-header">
                    <div class="admin-icon">
