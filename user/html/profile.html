<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link rel="stylesheet" href="../css/profile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- Left Arrow -->
<a href="../html/certificate.html" class="arrow-btn">
    &#8592;
</a>

<!-- Right Arrow -->
<a href="../html/index.html" class="arrow-btn">
    &#8594;
</a>

<div class="container">

    <!-- Sidebar -->

    <div class="sidebar">

        <img id="sidebarImage"
        src="../images/queenQ.jpg">

        <h2>Anisha Kunwar</h2>
        <p>Beginner</p>

        <ul>

            <li><a href="../html/dashboard.html">Dashboard</a></li>
            <li><a href="../html/categories.html">Categories</a></li>
            <li><a href="../html/leaderboard.html">Leaderboard</a></li>
            <li><a href="../html/profile.html">Profile</a></li>
            <li><a href="../html/certificate.html">Certificate</a></li>
            <li><a href="../html/login.html">Logout</a></li>

        </ul>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <div class="tabs">

            <button id="profileTab">Profile Information</button>
            <button id="passwordTab">Change Password</button>

        </div>

        <!-- PROFILE FORM -->

        <form id="profileForm">

            <div id="profileSection">

                <div class="image-section">

                    <img id="profileImage"
                    src="../images/queenQ.jpg">

                    <br>

                    <label for="uploadImage"
                    class="upload-btn">

                        Upload Photo

                    </label>

                    <input
                    type="file"
                    id="uploadImage"
                    hidden>

                </div>


                <div class="form-section">

                    <label>Full Name</label>

                    <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your Full Name">


                    <label>Username</label>

                    <input
                    type="text"
                    id="username"
                    placeholder="Enter Username">


                    <label>Email</label>

                    <input
                    type="email"
                    id="email"
                    placeholder="Enter Email">


                    <label>Phone Number</label>

                    <input
                    type="text"
                    id="phone"
                    placeholder="Enter Phone Number">


                    <label>About</label>

                    <textarea
                    id="about"
                    rows="5"
                    placeholder="Tell something about yourself"></textarea>


                    <button
                    type="submit"
                    class="save-btn">

                        Update Profile

                    </button>

                </div>

            </div>

        </form>

        <!-- PASSWORD FORM -->

        <form id="passwordForm">

            <div id="passwordSection">

                <label>Current Password</label>

                <input
                type="password"
                id="currentPassword"
                placeholder="Current Password">


                <label>New Password</label>

                <input
                type="password"
                id="password"
                placeholder="New Password">


                <label>Confirm Password</label>

                <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password">


                <button
                type="submit"
                class="save-btn">

                    Change Password

                </button>

            </div>

        </form>

    </div>

</div>

<script src="../js/profile.js"></script>

</body>
</html>
