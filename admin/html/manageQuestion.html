<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Questions</title>
  <link rel="stylesheet" href="../css/styleManageQuestion.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <header>
    <div class="logo-container">
      <div class="logo-icon">
        <img src="logo.jpeg" alt="Online Quiz Platform">
      </div>
    </div>
    <nav class="nav-bar">
      <input type="text" placeholder="search/help">
    </nav>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="admin-header">
          <div class="admin-icon">
            <i class="fa-regular fa-user"></i>
          </div>
          <a href="adminProfile.html">
            <span class="admin-title">Admin</span>
          </a>
        </div>
        <ul class="sidebar-menu">
          <li><a href="adminDashboard.html">Admin Dashboard</a></li>
          <li><a href="manageCategories.html">Manage Categories</a></li>
          <li><a href="manageQuestion.html">Manage Questions</a></li>
          <li><a href="userDetails.html">User Details</a></li>
        </ul>
      </div>
      <div class="sidebar-bottom">
        <a href="adminlogin.html" class="logout-btn">Log out</a>
      </div>
    </aside>

    <main class="content-area">
      <h1 class="page-title">Manage Questions</h1>

      <div class="selection-box">
        <div class="form-row">
          <label for="subjectSelect">Select Subject</label>
          <select id="subjectSelect">
            <option value="">-- Select Subject --</option>
          </select>
        </div>

        <div class="form-row">
          <label for="setSelect">Select Set</label>
          <select id="setSelect" disabled>
            <option value="">-- Select Set --</option>
          </select>
        </div>

        <div class="form-row" id="timerRow" style="display:none;">
          <label>Set Timer (for entire set)</label>
          <div class="timer-inputs">
            <div class="timer-field">
              <input type="number" id="timerHr" min="0" max="23" value="0">
              <span>hr</span>
            </div>
            <div class="timer-field">
              <input type="number" id="timerMin" min="0" max="59" value="0">
              <span>min</span>
            </div>
            <div class="timer-field">
              <input type="number" id="timerSec" min="0" max="59" value="0">
              <span>sec</span>
            </div>
            <button type="button" class="btn-secondary" id="saveTimerBtn">Save Timer</button>
          </div>
          <p class="timer-saved-msg" id="timerSavedMsg" style="display:none;">Timer saved &#10003;</p>
        </div>

        <div class="action-buttons" id="actionButtons" style="display:none;">
          <button type="button" class="btn-secondary" id="viewQuestionsBtn">View Questions</button>
          <button type="button" class="btn-primary" id="addQuestionsBtn">Add Questions</button>
        </div>
      </div>
    </main>
  </div>
  
  
<script src="../js/manageQuestion.js"></script>
</body>
</html>
