<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../css/styleadminlogin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <!-- nav bar -->
  <header>
    <div class="logo-container">
      <div class="logo-icon">
        <img src="logo.jpeg" alt="Online Quiz Platform">
      </div>
    </div>

    <nav class="nav-bar">
      <a href="home.html">Home</a>
      <a href="categories.html">Categories</a>
      <a href="leaderboard.html">Leaderbord</a>
      <a href="contact.html">Contact us</a>
    </nav>

    <div class="nav-buttons">
      <a href="adminlogin.html">
        <button class="btn-nav-login">Login</button>
      </a>
      <a href="Signup.html">
        <button class="btn-nav-signup">Signup</button>
      </a>
    </div>
  </header>

  <!-- main container -->
  <main>
    <div class="card-container">
      <div class="left-panel">
        <div class="welcome-icon-wrapper">
          <i class="fa fa-user-circle fa-5x" aria-hidden="true"></i>
        </div>
        <h2>Welcome back!</h2>
        <p>Please log in to continue</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <h1>Log in:</h1><br>
          <label for="identifier">Email</label>
          <div class="input-wrapper">
            <input type="text" id="identifier" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="enter your password" required>
            <button type="button" class="toggle-password" id="togglePasswordBtn">Show</button>
          </div>
        </div>

        <!-- Error message -->
        <div id="errorMsg" class="error-message" style="display: none;"></div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Remember Me</span>
          </label><br>
          <a href="forgotpsw.html" class="forgot-link">Forgot password?</a>
        </div>

        <div class="input-wrapper">
          <button type="submit" class="btn-submit" id="submitBtn">Log In</button>
        </div>
      </form>
    </div>
  </main>
   <script src="../js/adminlogin.js"></script>
</body>

</html>
