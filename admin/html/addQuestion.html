<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Question</title>
  <link rel="stylesheet" href="../css/styleAddQuestions.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <header>
    <div class="logo-container">
      <div class="logo-icon">
        <img src="logo.jpeg" alt="Online Quiz Platform">
      </div>
    </div>
    <nav class="nav-bar">
      <input type="text" placeholder="search/help">
    </nav>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="admin-header">
          <div class="admin-icon">
            <i class="fa-regular fa-user"></i>
          </div>
          <a href="adminProfile.html">
            <span class="admin-title">Admin</span>
          </a>
        </div>
        <ul class="sidebar-menu">
          <li><a href="adminDashboard.html">Admin Dashboard</a></li>
          <li><a href="manageCategories.html">Manage Categories</a></li>
          <li><a href="manageQuestion.html">Manage Questions</a></li>
          <li><a href="userDetails.html">User Details</a></li>
        </ul>
      </div>
      <div class="sidebar-bottom">
        <a href="adminlogin.html" class="logout-btn">Log out</a>
      </div>
    </aside>

    <main class="content-area">
      <div class="screen-header">
        <button type="button" class="btn-back" id="backBtn">&larr; Back</button>
        <h1 class="page-title" id="formTitle">Add Question</h1>
      </div>
      <p class="context-line" id="formContext"></p>

      <form id="questionForm">

  <div class="form-row">
    <label for="questionText">Question</label>

    <textarea
      id="questionText"
      name="question"
      rows="3"
      placeholder="Enter the question"
      required></textarea>
  </div>


  <div class="options-grid">

    <!-- OPTION A -->
    <div class="option-row">
      <input
        type="radio"
        name="correctAnswer"
        value="0"
        id="correctRadio0"
        required>

      <input
        type="text"
        id="optionText0"
        name="optionA"
        placeholder="Option A"
        required>
    </div>


    <!-- OPTION B -->
    <div class="option-row">
      <input
        type="radio"
        name="correctAnswer"
        value="1"
        id="correctRadio1">

      <input
        type="text"
        id="optionText1"
        name="optionB"
        placeholder="Option B"
        required>
    </div>


    <!-- OPTION C -->
    <div class="option-row">
      <input
        type="radio"
        name="correctAnswer"
        value="2"
        id="correctRadio2">

      <input
        type="text"
        id="optionText2"
        name="optionC"
        placeholder="Option C"
        required>
    </div>


    <!-- OPTION D -->
    <div class="option-row">
      <input
        type="radio"
        name="correctAnswer"
        value="3"
        id="correctRadio3">

      <input
        type="text"
        id="optionText3"
        name="optionD"
        placeholder="Option D"
        required>
    </div>

  </div>


  <p class="hint-text">
    Select the radio button next to the correct option.
  </p>


  <div class="form-buttons">

    <button
      type="button"
      class="btn-cancel"
      id="cancelBtn"
      style="display:none;">
      Cancel
    </button>

    <button
      type="submit"
      class="btn-secondary"
      id="nextBtn">
      Next
    </button>

    <button
      type="button"
      class="btn-primary"
      id="saveBtn">
      Save
    </button>

  </div>

</form>
  <script src="../js/addQuestion.js"></script>
</body>

</html>
