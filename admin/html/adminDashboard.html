<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/styleDashboard.css">
  <!-- Font Awesome for User Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <header>
    <div class="logo-container">
      <div class="logo-icon">
        <img src="logo.jpeg" alt="Online Quiz Platform">
      </div>
    </div>
    <nav class="nav-bar">
      <input type="text" placeholder="search/help">
    </nav>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="admin-header">
          <div class="admin-icon">
            <i class="fa-regular fa-user"></i>
          </div>
          <a href="adminProfile.html">
            <span class="admin-title">Admin</span>
          </a>
        </div>

        <ul class="sidebar-menu">
          <li><a href="adminDashboard.html">Admin Dashboard</a></li>
          <li><a href="manageCategories.html">Manage Categories</a></li>
          <li><a href="manageQuestion.html">Manage Questions</a></li>
          <li><a href="userDetails.html">User Details</a></li>
        </ul>
      </div>

      <div class="sidebar-bottom">
        <a href="adminlogin.html" class="logout-btn">Log out</a>
      </div>
    </aside>

    <main class="content-area">
      <div class="dashboard-grid">
        <div class="stat-card">
          <h2 class="card-title">Total Quiz<br>Attempts</h2>
          <p class="card-number" id="statAttempts">0</p>
        </div>
        <div class="stat-card">
          <h2 class="card-title">Total Students</h2>
          <p class="card-number" id="statStudents">0</p>
        </div>
        <div class="stat-card">
          <h2 class="card-title">Total Pass Rate</h2>
          <p class="card-number" id="statPassRate">0%</p>
        </div>
        <div class="stat-card">
          <h2 class="card-title">Total Visitors</h2>
          <p class="card-number" id="statVisitors">0</p>
        </div>
      </div>
    </main>
  </div>
   <script src="../js/adminDashboard.js"></script>

</body>

</html>
